[project]
name = "filler-token-reasoning"
version = "0.1.0"
description = "Opaque reasoner experiments with filler tokens"
requires-python = ">=3.10"
dependencies = [
    "torch==2.2.0",
    "torchvision==0.17.0",
    "torchaudio==2.2.0",
    "transformers==4.45.0",
    "accelerate==0.34.0",
    "bitsandbytes==0.44.0",
    "peft==0.13.0",
    "datasets",
    "tqdm",
    "wandb",
    "setuptools",
    "numpy<2",
]

[tool.uv]
index-url = "https://download.pytorch.org/whl/cu121"
extra-index-url = ["https://pypi.org/simple"]