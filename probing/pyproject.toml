[project]
name = "filler-probing"
version = "0.1.0"
description = "Probing DeepSeek V3 hidden states during filler tokens"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4.0",
    "transformers>=4.48,<5",
    "accelerate>=1.0.0",
    "bitsandbytes>=0.45.0",
    "safetensors",
    "sentencepiece",
    "scikit-learn",
    "numpy<2",
    "pandas",
    "matplotlib",
    "seaborn",
    "tqdm",
    "huggingface_hub",
    "autoawq==0.2.7.post3",
]

[tool.uv]
index-url = "https://download.pytorch.org/whl/cu124"
extra-index-url = ["https://pypi.org/simple"]
