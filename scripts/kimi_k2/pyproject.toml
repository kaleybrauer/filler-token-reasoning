[project]
name = "filler-probing"
version = "0.1.0"
description = "Probing DeepSeek V3 hidden states during filler tokens"
requires-python = ">=3.10"
dependencies = [
    "torch==2.6.0+cu124",
    "transformers>=4.48,<5",
    "accelerate>=1.0.0",
    "bitsandbytes>=0.45.0",
    "safetensors",
    "sentencepiece",
    "scikit-learn",
    "numpy<2",
    "pandas",
    "matplotlib",
    "seaborn",
    "tqdm",
    "huggingface_hub",
    "autoawq==0.2.7.post3",
    "autoawq-kernels>=0.0.9",
    "setuptools",
    "tiktoken>=0.12.0",
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
